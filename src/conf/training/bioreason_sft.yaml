# BioReason Stage 2: SFT with LoRA
# Loads projector weights from Stage 1 (bioreason_projector.yaml) and freezes them.
# Trains only LoRA adapters on the LLM backbone. DNA encoder remains frozen.
# Based on: https://arxiv.org/abs/2505.23579
#
# Before running: set resume_weights_only to the Stage 1 checkpoint path, e.g.:
#   resume_weights_only: /path/to/stage1/outputs/.../checkpoints/step_final

task: "bioreason_sft"
batch_size: 1
max_steps: 10000  # ~10 epochs over KEGG (1450 train samples); previous 5000 steps showed no convergence trend
device: "auto"
learning_rate: 5e-5
gradient_accumulation_steps: 8
eval_enabled: true  # ZoneATrainer's periodic-eval block is opt-in; must be true for the KEGG eval below to fire
eval_every_n_steps: 1000  # Also drives the KEGG validation eval below
viz_every_n_steps: 1000

# KEGG validation eval (wanglab/kegg 'val' split), run inline during training on
# the eval_every_n_steps cadence above. See ZoneATrainer.run_kegg_eval /
# eval_kegg.py for the offline equivalent.
kegg_eval_max_examples: null  # null = full val split

# Checkpointing
save_every_n_steps: 500
resume_from_checkpoint: null
# Set this to the Stage 1 checkpoint directory to load projector weights.
# Loads model weights only — optimizer and step counter reset for the new stage.
resume_weights_only: ${oc.env:PRISM_OUTPUT_ROOT,<set-PRISM_OUTPUT_ROOT>}/GENOME-PROJECTOR-1B/2026-06-18/16-57-40/checkpoints/step_1500
output_dir: ${hydra:run.dir}

# Optimization
warmup_steps: 300  # 3% of max_steps=10000; reduced from 500 — projector already pretrained
weight_decay: 0.01  
scheduler_type: "cosine"
min_lr_ratio: 0.0

# Differential Learning Rates
lr_connector: 5e-5   # Projector LR
lr_dna: 5e-6          # DNA encoder LR — only active if freeze_vit: false (frozen by default)
lr_llm: null           # LLM frozen by default

# Freezing
# freeze_llm and lora_enabled are independent knobs: freeze_llm freezes the
# base backbone, lora_enabled adds trainable LoRA adapters on top. Both true
# here -- base backbone frozen, only the LoRA adapters train.
freeze_llm: true     # base backbone frozen; LoRA adapters (below) are the only trainable part
freeze_vit: true     # DNA encoder frozen (matches BioReason default)
freeze_connector: true  # projector loaded from Stage 1 and frozen; only LoRA trains

# LoRA (applied to LLM backbone)
lora_enabled: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
# lora_target_modules: null  # null = auto-detect all nn.Linear layers (excluding lm_head)

# Data format: include reasoning traces in Stage 2 so LoRA learns chain-of-thought.
use_reasoning_traces: true

# Class-balanced loss: inverse-frequency weighting so rare diseases get proportional gradient.
# Weights computed from wanglab/kegg train split at dataset init.
# w_c = min(N / (C * n_c), class_weight_max) — capped to avoid n=1 instability.
use_class_weights: true
class_weight_max: 10.0

# Data
data_num_workers: 1

# BioReason-specific
bioreason_dataset: "wanglab/kegg"  # or variant_effect_coding, variant_effect_non_snv
max_dna_length: 1024
max_text_length: 1024
dna_truncation_per_side: 1024

# Distributed
distribution_strategy: "ddp"

ddp:
  bucket_cap_mb: 25
  find_unused_parameters: false
  static_graph: true
  gradient_as_bucket_view: true
