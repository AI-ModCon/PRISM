  # ============================================================================
  # Per-modality smoke sweep (Phase 2 plan)
  # 1 node / 12 XPUs, OLMo-1B, DDP, BS=8. 50 steps = ~30 post-warmup rolling
  # window. Eval + checkpointing disabled — only perf.jsonl matters. Paired
  # with experiments/modality_presets.yaml (text_image, text_ts, text_graph,
  # text_table, text_geometry) and per-preset skip-overrides at
  # src/conf/data/per_modality_smoke/<preset>.yaml via tools/run_sweep.py.
  #
  # NOTE: the `text_only` preset is NOT compatible with this design — backbone
  # and encoders are frozen, so a text-only cell has zero trainable params and
  # DDP refuses with a hard error. Sweep drivers must skip it (or run a
  # variant that unfreezes the backbone).
  # ============================================================================
  - id: PRISM-MODALITY-SMOKE
    name: "Per-modality smoke: 1N, OLMo-1B, DDP, BS=8, 50 steps"
    resources:
      ngpus: 12
      topology: "12xpu_aurora"
      walltime: "00:30:00"
    common_overrides:
      model.backbone_id: "allenai/OLMo-1B-0724-hf"
      model.freeze_backbone: true
      model.freeze_encoders: true
      model.d_img: 768
      training.batch_size: 8
      training.gradient_accumulation_steps: 1
      training.max_steps: 50
      training.learning_rate: 5e-4
      training.weight_decay: 0.0
      training.warmup_steps: 10
      training.eval_every_n_steps: 0
      training.save_every_n_steps: 0
      training.viz_every_n_steps: 0
      training.device: "xpu"
      training.verbosity: "INFO"
    variants:
      - id: PRISM-MODALITY-SMOKE-1N
        name: "1-node per-modality smoke"
        overrides: {}
      - id: PRISM-MODALITY-SMOKE-SCITS-1N
        name: "2-node SciTS smoke (text+time_series)"
        overrides:
          model.modalities: [text, time_series]
          model.modality_start_end_token_indices.time_series: [50280, 50281]
      - id: PRISM-MODALITY-SMOKE-TEXTONLY-1N
        name: "1-node text-only smoke (backbone unfrozen)"
        # Parent freezes backbone+encoders, which leaves the text_only cell
        # with zero trainable params and DDP fails hard. This variant
        # unfreezes the backbone so the text_only sweep cell can train.
        # Both model.freeze_backbone AND training.freeze_llm must be false —
        # the trainer reads training.freeze_llm as authoritative
        # (src/training/trainer_zone_a.py:245).
        overrides:
          model.freeze_backbone: false
          "+training.freeze_llm": false
