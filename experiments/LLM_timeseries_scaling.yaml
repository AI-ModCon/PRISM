# Experiment configuration for Qwen3/OLMo + TS encoder scaling studies
experiments:

  - id: PRISM-OLMO-1B-TSQA
    name: "OLMo-1B TS_QA Alignment (Interleaved TS)"
    default_dataset_groups: ts_qa
    resources:
      ngpus: 12
      topology: "12xpu_aurora"
      walltime: "02:00:00"
    common_overrides:
      # Model config includes custom tokenizer + interleaving token indices
      # for text/time_series training with a linear TS projector.
      model: prism_olmo1b_linear_interleaved_ts

      # Alignment phase: frozen LLM backbone; train TS encoder + projector.
      training: encoder_projector
      training.batch_size: 2
      training.gradient_accumulation_steps: 2
      training.max_steps: 5000
      training.weight_decay: 0.0
      training.lr_connector: 1e-4

      # Logging & Checkpointing
      training.eval_every_n_steps: 250
      training.save_every_n_steps: 500
      training.viz_every_n_steps: 0
      training.device: "xpu"
      training.verbosity: "INFO"
    variants:
      - id: PRISM-OLMO-1B-TSQA-DEFAULT
        overrides: {}

      - id: PRISM-OLMO-1B-TSQA-SMOKE
        name: "OLMo-1B TS_QA smoke"
        overrides:
          training.max_steps: 100
          training.eval_every_n_steps: 25
          training.save_every_n_steps: 50
          training.viz_every_n_steps: 0
  - id: PRISM-OLMO-1B-TIMEOMNI
