    common_overrides:
      <<: *qwen_siglip_common_16n
      model: prism_qwen3_0_6b_image_only
      model.image_size: 256
      training.learning_rate: 0.0001
      training.lr_connector: 0.0001
      training.lr_vit: 0.0001
      training.lr_llm: 0.0001
      exp.sweep_id: "qwen3_0p6b_siglip2_patch16_256_encoder_sweep_global_shuffle_v1"
      exp.preset: "global_shuffle_v1_16n_bs4_gbs768_encoder_sweep_qwen3_0p6b"
    variants:
      - id: QWEN3-0P6B-SIGLIP2-BASE256-GLOBALSHUFV1-16N
        name: "Qwen3 0.6B + SigLIP2 base patch16-256"
        overrides:
          model.d_img: 768
          model.image_encoder_id: "google/siglip2-base-patch16-256"
          model.image_processor_id: "google/siglip2-base-patch16-256"

      - id: QWEN3-0P6B-SIGLIP2-LARGE256-GLOBALSHUFV1-16N
        name: "Qwen3 0.6B + SigLIP2 large patch16-256"
        overrides:
          model.d_img: 1024
