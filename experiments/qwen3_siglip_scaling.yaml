      topology: "16x12xpu_aurora"
      walltime: "12:00:00"
    common_overrides:
      <<: *qwen_siglip_common_16n
      model: prism_qwen3_0_6b_image_only
      exp.sweep_id: "qwen3_siglip_global_shuffle_v1_train25k_gbs768_invsqrt_lr"
      exp.preset: "global_shuffle_v1_16n_bs4_gbs768_invsqrt_lr"
    variants:
      - id: QWEN3-0P6B-SIGLIP2-GLOBALSHUFV1-16N-INVSQRTLR
        name: "Qwen3 0.6B + SigLIP2 global-shuffle v1, inverse-sqrt LR anchor"
        overrides:
          model: prism_qwen3_0_6b_image_only
