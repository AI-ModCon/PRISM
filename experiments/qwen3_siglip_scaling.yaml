          model.image_processor_id: "google/siglip2-large-patch16-256"

      - id: QWEN3-0P6B-SIGLIP2-SO400M256-GLOBALSHUFV1-16N
        name: "Qwen3 0.6B + SigLIP2 so400m patch16-256"
        overrides:
          model.d_img: 1152
          model.image_encoder_id: "google/siglip2-so400m-patch16-256"
