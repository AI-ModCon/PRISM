          training.learning_rate: 0.00006325
          training.lr_connector: 0.00006325
          training.lr_vit: 0.00006325
          training.lr_llm: 0.00006325

      - id: QWEN3-8B-SIGLIP2-GLOBALSHUFV1-16N-INVSQRTLR
