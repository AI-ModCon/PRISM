repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with requirements/ci.txt:1 (ruff==0.16.9). When the hook
    # and CI run different ruff versions, the hook passes locally and the
    # `lint` job then fails on rules the older version did not have.
    rev: v0.16.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
