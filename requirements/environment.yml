name: prism_env
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=11.8
  - pip:
    - transformers
    - accelerate
    - einops
    - numpy
    - pandas
    - scikit-learn
    - wandb
    - hydra-core
    - omegaconf
    - tqdm
    - pytest
    - torch_geometric
    - pyg_lib
    - torch_scatter
    - torch_sparse
    - torch_cluster
    - torch_spline_conv
    - timesfm # Assuming available on PyPI, otherwise install from git
    - fastapi
    - uvicorn
    - gradio
    - pydantic
